version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogify_api
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mongodb://db:27017/blogify_dev
      JWT_SECRET: dev_secret_key
      PORT: 3000
    depends_on:
      - db
    restart: always

  db:
    image: mongo:6
    container_name: blogify_db
    ports:
      - "27017:27017"
    volumes:
      - db-data:/data/db
    restart: always

volumes:
  db-data: